# version: '3.8'
services:
  # Kafka in KRaft mode (single-node broker + controller).
  # ZooKeeper was removed in Kafka 4.0 / Confluent Platform 8.0, so there is
  # no zookeeper service any more and the broker self-manages metadata.
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: mjop6gvIQhCry79CvPSK3g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - EasyEats-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Creates every topic the services use before they start.
  # Without this the services race Kafka's lazy auto-creation and the first
  # metadata request fails with UNKNOWN_TOPIC_OR_PARTITION, crashing them.
  kafka-init:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic auth-requests --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic auth-responses --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic delivery-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic notification-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order-status --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic order_placed --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic owner-validation --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic restaurant-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic restaurant-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic restaurant-status --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-order --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-request --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-response --partitions 1 --replication-factor 1;
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user-validation --partitions 1 --replication-factor 1;
        echo "--- topics ready ---";
        kafka-topics --bootstrap-server kafka:9092 --list;
    networks:
      - EasyEats-network
    restart: "no"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "5003:5003"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - PORT=5003
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set — copy .env.example to .env and fill it in}
      - JWT_EXPIRES_IN=1h
      - MONGO_URI=${MONGO_URI_USERS:?MONGO_URI_USERS is not set — copy .env.example to .env and fill it in}
    networks:
      - EasyEats-network
    restart: on-failure

  authentication-service:
    build: ./authentication-service
    container_name: authentication-service
    ports:
      - "3002:3002"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set — copy .env.example to .env and fill it in}
      - JWT_EXPIRES_IN=1h
      - KAFKA_BROKER=kafka:9092
      - MONGO_URI=${MONGO_URI_USERS:?MONGO_URI_USERS is not set — copy .env.example to .env and fill it in}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - EasyEats-network
    restart: on-failure

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI_USERS:?MONGO_URI_USERS is not set — copy .env.example to .env and fill it in}
      - KAFKA_BROKER=kafka:9092
      # How far a driver may be from the pickup point and still be offered the
      # order. Dispatch asks nearest-first, so this is a ceiling, not a target.
      - NEARBY_DRIVER_RADIUS_METERS=50000
    networks:
      - EasyEats-network
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5002:5002"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI_ORDERS:?MONGO_URI_ORDERS is not set — copy .env.example to .env and fill it in}
      - KAFKA_BROKER=kafka:9092
    networks:
      - EasyEats-network
    restart: on-failure

  resturant-service:
    build: ./resturant-service
    container_name: resturant-service
    ports:
      - "5004:5004"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - PORT=5004
      - MONGO_URI=${MONGO_URI_RESTAURANTS:?MONGO_URI_RESTAURANTS is not set — copy .env.example to .env and fill it in}
      - KAFKA_BROKER=kafka:9092
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is not set}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is not set}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is not set}
    networks:
      - EasyEats-network
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "5005:5005"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - PORT=5005
      - MONGO_URI=${MONGO_URI_NOTIFICATIONS:?MONGO_URI_NOTIFICATIONS is not set — copy .env.example to .env and fill it in}
      - KAFKA_BROKER=kafka:9092
      - EMAIL_USER=${EMAIL_USER:?EMAIL_USER is not set}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:?EMAIL_PASSWORD is not set}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID is not set}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN is not set}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:?TWILIO_PHONE_NUMBER is not set}
    networks:
      - EasyEats-network
    restart: on-failure

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "5006:5006"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
    - PORT=5006
    - MONGO_URI=${MONGO_URI_PAYMENTS:?MONGO_URI_PAYMENTS is not set — copy .env.example to .env and fill it in}
    - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is not set}
    - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is not set}
    - KAFKA_BROKER=kafka:9092  # Changed from localhost:9092
    networks:
      - EasyEats-network
    restart: on-failure

  location_org:
    build: ./location_org
    container_name: location_org
    ports:
      - "3001:3001"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
    - PORT=3001
    - CLIENT_URL=http://localhost:5173
    - NODE_ENV=development
    - MONGO_URI=${MONGO_URI_DELIVERY:?MONGO_URI_DELIVERY is not set — copy .env.example to .env and fill it in}
    - KAFKA_BROKER=kafka:9092  # Added this line
    - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set — copy .env.example to .env and fill it in}
    - GATEWAY_URL=http://api-gateway:5003
    # Sequential dispatch: how long one driver has to answer, how long to wait
    # before sweeping the candidate list again, and how many sweeps to attempt.
    - OFFER_TIMEOUT_MS=30000
    - DISPATCH_ROUND_PAUSE_MS=60000
    - DISPATCH_MAX_ROUNDS=5
    networks:
      - EasyEats-network
    restart: on-failure

networks:
  EasyEats-network:
    driver: bridge

volumes:
  kafka-data: