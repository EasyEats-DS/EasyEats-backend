      - KAFKA_BROKER=kafka:9092
      - EMAIL_USER=radalapuththu@gmail.com
      - EMAIL_PASSWORD=lltaxfluinkzxbxs
      - TWILIO_ACCOUNT_SID=AC4bae37c77902e4e82bd53da5f8fed20d
